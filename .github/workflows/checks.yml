name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - name: Check script syntax
        run: for file in server.mjs lib/*.mjs scripts/*.mjs public/*.js netlify/functions/*.mjs; do node --check "$file" || exit 1; done
      - run: node --test
