# Hosts the planner and research API together; no ChatGPT service is used.
services:
  - type: web
    name: applytrack
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile --prod --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
